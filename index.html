<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120906" />
    <meta name="description" content="Empire Games café menu — drinks, hookah, crêpes and West Burger." />
    <title>Empire Games Menu</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png" />
    <link rel="apple-touch-icon" href="assets/images/logo.png" />

    <!-- Apply saved theme/language before paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem("eg:theme");
        var l = localStorage.getItem("eg:lang");
        if (t) document.documentElement.dataset.theme = JSON.parse(t);
        if (l) {
          l = JSON.parse(l);
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/loader.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/effects.css" />
  </head>
  <body>
    <!-- Background particles -->
    <canvas class="particles" id="particles" aria-hidden="true"></canvas>

    <!-- Loading screen -->
    <div class="loader" id="loader" role="status">
      <div class="loader__inner">
        <div class="loader__logo-wrap">
          <div class="loader__pulse"></div>
          <div class="loader__ring"></div>
          <img class="loader__logo" src="assets/images/logo.png" alt="Empire Games" />
        </div>
        <h1 class="loader__title gradient-text" data-brand="name">Empire Games</h1>
        <p class="loader__tagline" data-brand="tagline"></p>
        <div class="loader__bar"><span id="loaderBar"></span></div>
        <p class="loader__status" id="loaderStatus" data-i18n="loading"></p>
        <button class="loader__enter ripple" id="enterBtn" type="button" hidden data-i18n="enter"></button>
      </div>
    </div>

    <!-- App -->
    <div class="app" id="app" hidden>
      <header class="topbar">
        <a class="brand" href="#/">
          <img src="assets/images/logo.png" alt="" />
          <span class="gradient-text" data-brand="name">Empire Games</span>
        </a>
        <div class="actions">
          <button class="icon-btn ripple" id="searchBtn" type="button" data-i18n-attr="aria-label:searchTitle">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          </button>
          <button class="icon-btn ripple" id="musicBtn" type="button" data-i18n-attr="aria-label:toggleMusic">
            <svg class="icon-music-on" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>
            <svg class="icon-music-off" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z" /><path d="m22 9-6 6M16 9l6 6" /></svg>
          </button>
          <button class="icon-btn ripple" id="themeBtn" type="button" data-i18n-attr="aria-label:toggleTheme">
            <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
            <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          </button>
          <button class="icon-btn lang-btn ripple" id="langBtn" type="button" data-i18n="toggleLang"></button>
        </div>
      </header>

      <div class="searchbar" id="searchbar" hidden>
        <input id="searchInput" type="search" autocomplete="off" data-i18n-attr="placeholder:search,aria-label:searchTitle" />
        <button class="icon-btn ripple" id="searchClose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>

      <nav class="chips" id="chips" hidden data-i18n-attr="aria-label:categories"></nav>

      <main class="view" id="view"></main>

      <footer class="footer">
        <div class="footer__links" id="footerLinks"></div>
        <p data-i18n="footer"></p>
      </footer>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
